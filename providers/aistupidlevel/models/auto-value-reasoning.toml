# Routing mode, not a fixed model: the router picks a model per request. No [cost]: requests
# are billed by the chosen model's provider to the caller's own key (BYOK). [limit] is the
# smallest context/output among the models the router can choose (Kimi K2.7 Code context,
# Gemini Flash output), so it holds whichever model is picked.
name = "Auto Value Reasoning"
description = "Routes to the model with the most reasoning points per measured dollar, among models within 5 points of the best"
family = "auto"
release_date = "2026-09-25"
last_updated = "2026-09-25"
attachment = false
reasoning = false
temperature = true
tool_call = true
structured_output = true
open_weights = false

[limit]
context = 262_144
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
